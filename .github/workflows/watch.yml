name: Cinema City watchdog

# Prüft das Programm von Cinema City und legt ein Issue an, wenn neue Termine
# von Duna: část třetí im IMAX dazukommen (GitHub schickt dazu eine E-Mail
# und eine Push-Nachricht in die App).
#
# Geplant 4× pro Stunde, obwohl das Ziel eine Erkennung innerhalb von ~30
# Minuten ist: GitHub verwirft geplante Läufe unter Last gehäuft (gemessen:
# 1 von 8). Überzählige Läufe kosten nichts (öffentliches Repo) und machen
# nichts kaputt – gemeldet wird anhand des Zustands in state/seen.json, nicht
# anhand der Uhrzeit. Ein zusätzlicher Lauf stellt also nur fest, dass sich
# nichts geändert hat, und bleibt still. Die Minuten liegen bewusst abseits
# von :00 und :30 und verteilt, damit sie nicht dieselbe Lastspitze treffen.
on:
  schedule:
    - cron: "8,38 * * * *"
    - cron: "21,51 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Alle aktuellen Termine melden, auch bereits bekannte"
        type: boolean
        default: false

# Der Zustand wird ins Repo zurückcommittet – parallele Läufe würden sich
# gegenseitig den Commit überschreiben.
concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Programm prüfen
        id: watch
        # Anderen Film oder anderen Saaltyp überwachen? Diese Werte ändern und
        # danach state/seen.json neu erzeugen (sonst wird die neue Auswahl mit
        # dem alten Zustand verglichen).
        env:
          FILM_PATTERN: duna
          FILM_REQUIRE: "část třetí"
          AUDITORIUM_PATTERN: imax
          REQUIRE_ATTR: 70-mm
          # Wird im Text erwähnt (@…) – dadurch kommt genau eine E-Mail.
          MENTION: ${{ github.repository_owner }}
        run: |
          python3 watch.py \
            --state state/seen.json \
            --report report.md \
            --title title.txt \
            ${{ inputs.force_report && '--force-report' || '' }}

      - name: Issue mit neuen Terminen anlegen
        if: steps.watch.outputs.has_news == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Der Besitzer wird im Text per @-Erwähnung angesprochen. Das zählt
          # als "Participating", GitHub schickt also eine E-Mail – und zwar
          # genau eine. (Zuweisen und Schließen würden je eine weitere,
          # verwirrende Mail auslösen, deshalb passiert beides nicht.)
          url=$(gh issue create \
            --title "$(cat title.txt)" \
            --body-file report.md)
          echo "Angelegt: $url"

      - name: Zustand ins Repo zurückspeichern
        run: |
          rm -f report.md title.txt
          if git diff --quiet -- state/seen.json; then
            echo "Zustand unverändert, nichts zu committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "Zustand des Programms aktualisiert ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # Inzwischen könnte ein anderer Commit fertig sein – Rebase und Push erneut versuchen.
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "::error::Push des Zustands fehlgeschlagen."
          exit 1
